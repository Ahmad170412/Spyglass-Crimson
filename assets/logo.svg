<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="Spyglass-Crimson logo">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="chain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect width="320" height="80" rx="14" fill="url(#bg)"/>

  <!-- Crosshair / lens icon — the Spyglass-Crimson brand mark -->
  <g transform="translate(14, 16)" fill="none" stroke-width="1.8" stroke-linecap="round">
    <circle cx="19" cy="24" r="11" stroke="url(#chain)"/>
    <circle cx="19" cy="24" r="3" fill="#c41230" stroke="none"/>
    <line x1="19" y1="5"  x2="19" y2="12" stroke="#06b6d4" stroke-opacity="0.85"/>
    <line x1="19" y1="36" x2="19" y2="43" stroke="#06b6d4" stroke-opacity="0.85"/>
    <line x1="0"  y1="24" x2="7"  y2="24" stroke="#06b6d4" stroke-opacity="0.85"/>
    <line x1="31" y1="24" x2="38" y2="24" stroke="#06b6d4" stroke-opacity="0.85"/>
  </g>

  <!-- Project acronym -->
  <text x="62" y="36"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-weight="700" font-size="22"
        fill="url(#accent)" letter-spacing="1">SC</text>

  <!-- Divider -->
  <line x1="62" y1="44" x2="308" y2="44" stroke="#334155" stroke-width="0.8"/>

  <!-- Repo slug -->
  <text x="62" y="58"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="10.5" fill="#94a3b8" letter-spacing="0.5">Spyglass-Crimson</text>

  <!-- Tech chip: Python -->
  <rect x="180" y="48" width="40" height="14" rx="7" fill="#1e3a5f"/>
  <text x="200" y="58"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="8" fill="#38bdf8" text-anchor="middle">Python</text>

  <!-- Tech chip: Flask -->
  <rect x="224" y="48" width="34" height="14" rx="7" fill="#1c1917"/>
  <text x="241" y="58"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="8" fill="#fb923c" text-anchor="middle">Flask</text>

  <!-- Tech chip: Passive -->
  <rect x="262" y="48" width="46" height="14" rx="7" fill="#0c2340"/>
  <text x="285" y="58"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="8" fill="#818cf8" text-anchor="middle">Passive</text>
</svg>
